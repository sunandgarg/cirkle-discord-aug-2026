allowBuilds:
  '@swc/core': set this to true or false
  esbuild: set this to true or false
# Supabase 2.112.3 contains the ws security fix required by the production audit.
# These exact versions are intentionally exempted from pnpm's release-age gate;
# integrity hashes remain pinned in pnpm-lock.yaml.
minimumReleaseAgeExclude:
  - '@supabase/auth-js@2.112.3'
  - '@supabase/functions-js@2.112.3'
  - '@supabase/postgrest-js@2.112.3'
  - '@supabase/realtime-js@2.112.3'
  - '@supabase/storage-js@2.112.3'
  - '@supabase/supabase-js@2.112.3'

# These are the only packages allowed to run install-time native-binary checks.
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild
